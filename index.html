<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>우리집 퀘스트 보드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#DCEEFF">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gothic+A1:wght@400;600;800&display=swap">
<style>
/* Layout: landscape tablet. Left nav rail + one screen at a time, chunky "game button" cards. Single bright theme by choice. */
:root{
  --sky:#DCEEFF; --sky2:#C6E2FF;
  --ink:#1C2A4A; --ink2:#55648A;
  --card:#FFFFFF; --line:#B9CCE8;
  --gold:#FFC83D; --gold-d:#D89A00;
  --grass:#2FBF71; --grass-d:#1E8C51;
  --berry:#FF5D7A; --berry-d:#C93552;
  --violet:#6D55F0; --violet-d:#4A33C4;
  --mute:#E8EEF8;
  --f-display:"Jua","Gothic A1",system-ui,sans-serif;
  --f-body:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--f-body);font-size:16px;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
.app{display:grid;grid-template-columns:96px 1fr;height:100%;min-height:100%}
/* nav */
.nav{display:flex;flex-direction:column;gap:10px;padding:16px 10px;padding-left:max(10px,env(safe-area-inset-left,0px));background:var(--ink);align-items:center}
.nav .logo{font-family:var(--f-display);color:var(--gold);font-size:15px;text-align:center;line-height:1.1;margin-bottom:8px}
.nav button{width:76px;height:76px;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#C9D4EE;font-family:var(--f-display);font-size:15px}
.nav button .ic{font-size:30px;line-height:1}
.nav button[aria-current="page"]{background:var(--sky);color:var(--ink)}
.nav .spacer{flex:1}
.nav .small{height:56px;font-size:12px}
.nav .small .ic{font-size:22px}
main{min-width:0;overflow-y:auto;padding-block:20px;padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px))}
.screen{display:flex;flex-direction:column;gap:18px;max-width:1400px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
.panel{background:var(--card);border-radius:24px;border:3px solid var(--line);box-shadow:0 6px 0 var(--line);padding:20px}
.label{font-size:13px;letter-spacing:.06em;color:var(--ink2);font-weight:800}
.num{font-variant-numeric:tabular-nums}

/* HUD */
.hud{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.chip{display:flex;align-items:center;gap:8px;background:var(--card);border:3px solid var(--line);border-radius:999px;padding:6px 16px 6px 8px;font-family:var(--f-display);font-size:22px}
.chip .coin{width:32px;height:32px;border-radius:50%;background:var(--gold);border:3px solid var(--gold-d);display:grid;place-items:center;font-size:16px;color:#7A5300}
.chip.lv .coin{background:var(--violet);border-color:var(--violet-d);color:#fff}
.chip.fire .coin{background:var(--berry);border-color:var(--berry-d);color:#fff}

/* home */
.home-top{display:grid;grid-template-columns:1.1fr 1fr;gap:18px}
.clock{display:flex;flex-direction:column;justify-content:space-between;gap:12px;background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 6px 0 #0E1730}
.clock .time{font-family:var(--f-display);font-size:clamp(64px,9vw,120px);line-height:.95}
.clock .date{font-size:20px;color:#C9D4EE;font-weight:600}
.clock .hello{font-family:var(--f-display);font-size:26px;color:var(--gold)}
.now-quest{display:flex;flex-direction:column;gap:14px}
.now-quest .row{display:flex;align-items:center;gap:18px}
.ring{--p:0;width:120px;height:120px;flex:none;border-radius:50%;background:conic-gradient(var(--grass) calc(var(--p)*1%),var(--mute) 0);display:grid;place-items:center}
.ring>div{width:92px;height:92px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-family:var(--f-display);font-size:28px}
.now-quest h2{font-size:34px}
.left{font-weight:800;color:var(--berry-d);font-size:18px}
.bigbtn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:72px;padding:0 24px;border-radius:20px;background:var(--grass);color:#fff;font-family:var(--f-display);font-size:28px;box-shadow:0 6px 0 var(--grass-d);transition:transform .08s}
.bigbtn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--grass-d)}
.bigbtn.gold{background:var(--gold);color:var(--ink);box-shadow:0 6px 0 var(--gold-d)}

.timeline{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.tl{border-radius:20px;padding:14px 16px;background:var(--card);border:3px solid var(--line);display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0}
.tl .t{font-size:14px;color:var(--ink2);font-weight:800}
.tl .n{font-family:var(--f-display);font-size:22px}
.tl .bar{height:12px;border-radius:6px;background:var(--mute);overflow:hidden}
.tl .bar i{display:block;height:100%;background:var(--grass);border-radius:6px}
.pill{align-self:flex-start;font-size:13px;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--mute);color:var(--ink2)}
.tl.active{border-color:var(--violet);box-shadow:0 6px 0 var(--violet-d)}
.tl.active .pill{background:var(--violet);color:#fff}
.tl.clear .pill{background:var(--grass);color:#fff}
.tl.late .pill{background:var(--gold);color:var(--ink)}
.tl.missed .pill{background:var(--berry);color:#fff}

.home-bottom{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:18px}
.clock-row{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.wx{display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:right;min-width:0}
.wx .now{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:44px;line-height:1}
.wx .now .ic{font-size:48px}
.wx .sub{color:#C9D4EE;font-weight:600;font-size:16px}
.wx .tip{background:var(--gold);color:var(--ink);font-family:var(--f-display);font-size:17px;padding:3px 12px;border-radius:999px}
.wx .off{color:#93A3C8;font-size:14px;font-weight:600;max-width:22ch}
.sched h3{font-size:24px}
.sched ul{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.sched li{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--mute)}
.sched li .tm{font-family:var(--f-display);font-size:20px}
.sched li .tx{font-weight:700;min-width:0}
.sched li .tx small{display:block;color:var(--ink2);font-weight:600;font-size:13px}
.sched li .cd{font-size:13px;font-weight:800;color:var(--ink2);white-space:nowrap}
.sched li.next{background:#EFEAFF;outline:3px solid var(--violet)}
.sched li.next .cd{color:var(--violet-d)}
.sched li.past{opacity:.45}
.sched .empty{color:var(--ink2);font-weight:600;margin-top:12px}
.srow{display:grid;grid-template-columns:170px 120px 1fr auto;gap:8px;align-items:center}
.srow input{font:inherit;font-size:16px;padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);min-width:0;user-select:text;-webkit-user-select:text}
.days{display:flex;gap:4px;flex-wrap:wrap;grid-column:1/-1}
.day{width:38px;height:34px;border-radius:10px;border:2px solid var(--line);font-weight:800;font-size:14px;background:var(--card)}
.day[aria-pressed="true"]{background:var(--violet);border-color:var(--violet-d);color:#fff}
.erow{display:grid;grid-template-columns:64px 1fr 110px auto;gap:8px;align-items:center}
.erow input{font:inherit;font-size:16px;padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);min-width:0;user-select:text;-webkit-user-select:text}
.erow input.ic{text-align:center;font-size:24px;padding:4px}
.ehead{font-size:12px;font-weight:800;color:var(--ink2);letter-spacing:.04em}
.week{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:8px;overflow-x:auto;padding-bottom:4px}
.wcol{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:14px;background:var(--mute);min-width:0}
.wcol.today{outline:3px solid var(--violet);outline-offset:-3px}
.wcol .wd{font-family:var(--f-display);font-weight:400;font-size:20px;text-align:center}
.wblk{display:flex;flex-direction:column;gap:2px;text-align:left;padding:8px;border-radius:10px;background:var(--card);border:2px solid var(--line)}
.wblk span{font-size:12px;color:var(--ink2);font-weight:800}
.wblk b{font-size:14px}
.wblk small{font-size:12px;color:var(--ink2);line-height:1.5}
.wsc{font-size:12px;font-weight:700;padding:6px 8px;border-radius:10px;background:#EFEAFF;color:var(--violet-d)}
.sitem{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:14px;background:var(--mute)}
.geo{display:flex;gap:8px;flex-wrap:wrap}
.sis h3,.badges-mini h3{font-size:24px}
.sis-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.sis-btn{border-radius:18px;background:#FFF0F3;border:3px solid #FFC2CE;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:2px}
.sis-btn .ic{font-size:30px}
.sis-btn b{font-family:var(--f-display);font-weight:400;font-size:20px}
.sis-btn small{font-size:12px;color:var(--ink2);white-space:nowrap}
.sis-btn:active{background:#FFD9E1}
.badge-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.medal{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:var(--mute);border:3px dashed var(--line);filter:grayscale(1);opacity:.55}
.medal.on{background:#FFF4CF;border:3px solid var(--gold-d);filter:none;opacity:1}

/* missions */
.tabs{display:flex;gap:10px;flex-wrap:wrap}
.tab{flex:1 1 0;min-width:150px;border-radius:18px;padding:12px 16px;background:var(--card);border:3px solid var(--line);text-align:left;display:flex;flex-direction:column;gap:2px}
.tab b{font-family:var(--f-display);font-weight:400;font-size:22px}
.tab span{font-size:14px;color:var(--ink2);font-weight:600}
.tab[aria-selected="true"]{background:var(--violet);border-color:var(--violet-d);color:#fff}
.tab[aria-selected="true"] span{color:#E3DDFF}
.quest-head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.quest-head h2{font-size:34px}
.quest-head p{margin:4px 0 0;color:var(--ink2);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.m{position:relative;border-radius:24px;background:var(--card);border:3px solid var(--line);box-shadow:0 7px 0 var(--line);padding:18px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-height:190px;justify-content:center;transition:transform .08s}
.m:active{transform:translateY(5px);box-shadow:0 2px 0 var(--line)}
.m .ic{font-size:56px;line-height:1}
.m .nm{font-family:var(--f-display);font-size:24px;line-height:1.15}
.m .pt{font-weight:800;color:var(--gold-d);font-size:16px}
.m.done{background:#E6F9EE;border-color:var(--grass);box-shadow:0 7px 0 var(--grass-d)}
.m.done .ic{opacity:.35}
.m .stamp{position:absolute;top:10px;right:10px;transform:rotate(10deg);font-family:var(--f-display);font-size:22px;color:var(--grass-d);border:4px solid var(--grass-d);border-radius:14px;padding:2px 12px;background:rgba(255,255,255,.85)}
.m .stamp.late{color:var(--gold-d);border-color:var(--gold-d)}
.undo{font-size:13px;font-weight:800;color:var(--ink2);text-decoration:underline;padding:4px 8px}

/* rewards */
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.item{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.item .ic{font-size:44px}
.item h3{font-size:24px}
.price{display:flex;align-items:center;gap:6px;font-family:var(--f-display);font-size:22px;color:var(--gold-d)}
.hold{position:relative;overflow:hidden;width:100%;min-height:56px;border-radius:16px;background:var(--gold);box-shadow:0 5px 0 var(--gold-d);font-family:var(--f-display);font-size:19px;color:var(--ink)}
.hold[disabled]{background:var(--mute);box-shadow:0 5px 0 var(--line);color:var(--ink2);cursor:not-allowed}
.hold .fill{position:absolute;inset:0;width:0;background:rgba(255,255,255,.55)}
.hold span{position:relative}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.bd{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.bd .medal{width:84px;height:84px;font-size:40px}
.bd b{font-family:var(--f-display);font-weight:400;font-size:20px}
.bd small{color:var(--ink2);font-size:13px}
.log{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:auto}
.log li{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;border-radius:12px;background:var(--mute);font-weight:600}

/* parent */
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field input{font:inherit;font-size:18px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);user-select:text;-webkit-user-select:text}
.trow{display:flex;gap:8px;align-items:center}
.trow input{flex:1;min-width:0}
.btn{min-height:48px;padding:0 18px;border-radius:14px;background:var(--mute);border:2px solid var(--line);font-weight:800}
.btn.danger{background:#FFE3E8;border-color:#FFB3C0;color:var(--berry-d)}
.btn.primary{background:var(--violet);border-color:var(--violet-d);color:#fff}
.note{color:var(--ink2);font-size:14px;line-height:1.6;max-width:70ch}

/* toast & modal */
.toast{position:fixed;left:50%;top:calc(20px + env(safe-area-inset-top,0px));transform:translate(-50%,-150%);background:var(--ink);color:#fff;font-family:var(--f-display);font-size:24px;padding:12px 24px;border-radius:999px;z-index:30;opacity:0;visibility:hidden;transition:transform .25s,opacity .25s}
.toast.show{transform:translate(-50%,0);opacity:1;visibility:visible}
.modal{position:fixed;inset:0;background:rgba(28,42,74,.55);display:grid;place-items:center;z-index:40;padding:16px}
.modal .box{background:var(--card);border-radius:28px;padding:28px 32px;text-align:center;max-width:440px;width:100%;display:flex;flex-direction:column;gap:12px;align-items:center;animation:pop .35s ease-out}
.modal .big{font-size:84px;line-height:1}
.modal h2{font-size:34px}
.modal p{margin:0;color:var(--ink2);font-weight:600;line-height:1.5}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
.fly{position:fixed;z-index:35;font-family:var(--f-display);font-size:30px;color:var(--gold-d);pointer-events:none;animation:fly 1s ease-out forwards;text-shadow:0 2px 0 #fff}
@keyframes fly{to{transform:translateY(-110px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* narrow / portrait */
@media (max-width:1100px){.home-bottom{grid-template-columns:1fr 1fr}.home-bottom .sched{grid-column:1/-1}}
@media (max-width:900px){
  .home-top,.home-bottom{grid-template-columns:1fr}
  .srow{grid-template-columns:1fr 1fr}

}
@media (max-width:640px){
  .app{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .nav{order:2;flex-direction:row;justify-content:space-around;padding:8px max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
  .nav .logo,.nav .spacer{display:none}
  .nav button{width:60px;height:60px;font-size:12px}
  .nav button .ic{font-size:24px}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .ring{width:96px;height:96px}.ring>div{width:72px;height:72px;font-size:22px}
}
</style>

<div class="app">
  <nav class="nav" aria-label="화면">
    <div class="logo">우리집<br>퀘스트</div>
    <button data-go="home" aria-current="page"><span class="ic">🏠</span>홈</button>
    <button data-go="quest"><span class="ic">⚔️</span>미션</button>
    <button data-go="reward"><span class="ic">🎁</span>보상</button>
    <div class="spacer"></div>
    <button class="small" id="fsBtn"><span class="ic">⛶</span>전체화면</button>
    <button class="small" data-go="parent"><span class="ic">🔒</span>부모</button>
  </nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="modalRoot"></div>

<script>
(() => {

const DEFAULT_BLOCKS = [

  {id:'after', name:'하교 후 미션', start:'13:30', end:'17:00', days:[1,2,3,4,5], missions:[

    {id:'homework', ic:'✏️', nm:'학교 과제 끝내기', pt:20},

    {id:'wk_room', ic:'🧹', nm:'내 방 정리하기', pt:15},

// ---------- family schedule ----------
function todaySchedule(){
  const d=new Date(), wd=d.getDay(), n=nowMin();
  const list=S.schedule.filter(x=>x.time && x.days.includes(wd)).sort((a,b)=>toMin(a.time)-toMin(b.time));
  const next=list.find(x=>toMin(x.time)>=n);
  return list.map(x=>({...x, past:toMin(x.time)<n, next:x===next, left:toMin(x.time)-n}));
}
const fmtLeft=m=>m<=0?'지금':m<60?`${m}분 후`:`${Math.floor(m/60)}시간${m%60?' '+m%60+'분':''} 후`;

const pad = n => String(n).padStart(2,'0');
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const toMin = s => { const [h,m]=s.split(':').map(Number); return h*60+m; };
const nowMin = () => { const d=new Date(); return d.getHours()*60+d.getMinutes(); };
function today(){ const k=dkey(new Date()); if(!S.days[k]) S.days[k]={done:{},chest:{}}; return S.days[k]; }
function level(){ const lv=Math.floor(S.xp/200); return {lv:lv+1, title:LEVELS[Math.min(lv,LEVELS.length-1)], into:S.xp%200}; }

function blockStatus(b, day=today(), isToday=true){
  const list=ms(b,new Date().getDay()); const done=list.filter(m=>day.done[m.id]).length, total=list.length;
  const n=nowMin(), s=toMin(b.start), e=toMin(b.end);
  if(done===total) return {done,total,st: day.chest[b.id] ? 'clear':'late'};
  if(!isToday) return {done,total,st:'missed'};
  if(n<s) return {done,total,st:'upcoming'};
  if(n<=e) return {done,total,st:'active', left:e-n};
  return {done,total,st:'missed'};
}
const ST_LABEL={upcoming:'곧 시작', active:'지금 진행 중', clear:'시간 안에 클리어!', late:'완료', missed:'시간 지남'};
function currentBlock(){
  const n=nowMin();
  const tb=todayBlocks();
  const act=tb.find(b=>n>=toMin(b.start)&&n<=toMin(b.end));
  if(act) return act;
  return tb.find(b=>n<toMin(b.start)) || null;
}

function streak(){
  let c=0; const d=new Date();
  for(let i=0;i<60;i++){
    const day=S.days[dkey(d)];
    const fb=blocksFor(d.getDay())[0];
    if(day && day.chest && fb && day.chest[fb.id]) c++;
    else if(i>0) break;
    d.setDate(d.getDate()-1);
  }
  return c;
}
function checkBadges(){
  const days=Object.values(S.days);
  const has=id=>S.badges.includes(id);
  const earn=[];
  const total=days.reduce((a,d)=>a+Object.keys(d.done).length,0);
  if(total>=1) earn.push('first');
  if(days.some(d=>d.chest&&(d.chest.morning||d.chest.wkmorning))) earn.push('morning');
  if(days.some(d=>d.chest&&d.chest.after)) earn.push('study');
  if(Object.entries(S.days).some(([k,d])=>{const bs=blocksFor(wdOf(k)); return bs.length&&bs.every(b=>ms(b,wdOf(k)).every(m=>d.done[m.id]));})) earn.push('allclear');
  if(days.filter(d=>d.done.read).length>=5) earn.push('reader5');
  const st=streak(); if(st>=3) earn.push('streak3'); if(st>=7) earn.push('streak7');
  if(days.filter(d=>d.done.sister).length>=5) earn.push('kind');
  const fresh=earn.filter(id=>!has(id));
  fresh.forEach(id=>S.badges.push(id));
  return fresh;
}

    notes.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,actx.currentTime+i*.09);g.gain.exponentialRampToValueAtTime(.18,actx.currentTime+i*.09+.02);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+i*.09+.25);o.connect(g).connect(actx.destination);o.start(actx.currentTime+i*.09);o.stop(actx.currentTime+i*.09+.3);});
  }catch(e){}
}

// ---------- actions ----------
function complete(id, el){
  const day=today();
  const b=S.blocks.find(x=>x.missions.some(m=>m.id===id)); const m=b.missions.find(x=>x.id===id);
  if(day.done[id]) return;
  const n=nowMin(); const onTime=n<=toMin(b.end);
  const gain=m.pt+(onTime?ON_TIME_BONUS:0);
  day.done[id]={t:Date.now(), onTime, gain};
  S.coins+=gain; S.xp+=gain;
  const r=el.getBoundingClientRect(); flyAt(r.left+r.width/2, r.top+r.height/3, `+${gain}`);
  ding(true);
  let chest=false;
  if(ms(b,new Date().getDay()).every(x=>day.done[x.id]) && onTime && !day.chest[b.id]){ day.chest[b.id]=true; S.coins+=CHEST; S.xp+=CHEST; chest=true; }
  const fresh=checkBadges(); save(); render();
  if(chest) setTimeout(()=>modal('🧰','보물상자 획득!',`${b.name}을(를) 시간 안에 모두 끝냈어! 보너스 +${CHEST} 코인`),400);
  else if(ms(b,new Date().getDay()).every(x=>day.done[x.id])) setTimeout(()=>modal('👍','다 했어!',`${b.name} 완료. 다음엔 ${b.end} 전에 끝내서 보물상자를 열어 보자!`),400);
  if(fresh.length) setTimeout(()=>{const bd=BADGES.find(x=>x.id===fresh[0]); if(!$('#modalRoot').innerHTML) modal(bd.ic,'새 배지: '+bd.nm,bd.desc); else toast('새 배지: '+bd.nm);},chest?1200:500);
}
function undo(id){
  const day=today(); const d=day.done[id]; if(!d) return;
  const b=S.blocks.find(x=>x.missions.some(m=>m.id===id));
  S.coins=Math.max(0,S.coins-d.gain); S.xp=Math.max(0,S.xp-d.gain);
  if(day.chest[b.id]){ delete day.chest[b.id]; S.coins=Math.max(0,S.coins-CHEST); S.xp=Math.max(0,S.xp-CHEST); }
  delete day.done[id]; ding(false); save(); render(); toast('되돌렸어요');
}
function sisLog(k){ const sk=dkey(new Date()); S.sis[sk]=S.sis[sk]||{}; (S.sis[sk][k]=S.sis[sk][k]||[]).push(Date.now()); save(); render(); toast('기록했어요'); }

// hold-to-confirm for rewards
let holdT=null;
main.addEventListener('pointerdown',e=>{
  const h=e.target.closest('[data-hold]'); if(!h||h.disabled) return;
  const fill=h.querySelector('.fill'); const t0=performance.now();
  const step=now=>{ const p=Math.min(1,(now-t0)/1500); fill.style.width=(p*100)+'%';
    if(p>=1){ holdT=null; const r=S.rewards.find(x=>x.id===h.dataset.hold); if(!r) return; if(S.coins>=r.cost){ S.coins-=r.cost; S.redeemed.push({nm:r.nm,date:dkey(new Date())}); save(); ding(true); render(); modal(r.ic,r.nm+' 교환!','열심히 모은 코인으로 얻었어. 멋지다!'); } return; }
    holdT=requestAnimationFrame(step); };
  holdT=requestAnimationFrame(step);
  const stop=()=>{ if(holdT){cancelAnimationFrame(holdT);holdT=null;fill.style.width='0';} h.removeEventListener('pointerup',stop);h.removeEventListener('pointerleave',stop);h.removeEventListener('pointercancel',stop);};
  h.addEventListener('pointerup',stop);h.addEventListener('pointerleave',stop);h.addEventListener('pointercancel',stop);
});
main.addEventListener('contextmenu',e=>{ if(e.target.closest('[data-hold]')) e.preventDefault(); });

document.addEventListener('click',e=>{
  const t=e.target;
  const u=t.closest('[data-undo]'); if(u){ e.stopPropagation(); undo(u.dataset.undo); return; }
  const g=t.closest('[data-go]'); if(g){ go(g.dataset.go); return; }
  const o=t.closest('[data-open]'); if(o){ questTab=o.dataset.open; go('quest'); return; }
  const tb=t.closest('[data-tab]'); if(tb){ questTab=tb.dataset.tab; renderQuest(); return; }
  const m=t.closest('[data-m]'); if(m && !m.classList.contains('done')){ complete(m.dataset.m, m); return; }
  const s=t.closest('[data-sis]'); if(s){ sisLog(s.dataset.sis); return; }
});
main.addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-m]')){e.preventDefault();e.target.click();} });

function go(v){ view=v; if(v!=='quest') questTab=null; document.querySelectorAll('.nav [data-go]').forEach(b=>b.toggleAttribute('aria-current',b.dataset.go===v)); document.querySelectorAll('.nav [aria-current]').forEach(b=>b.setAttribute('aria-current','page')); render(); main.scrollTop=0; }
function render(){ ({home:renderHome,quest:renderQuest,reward:renderReward,parent:renderParent})[view](); }

// fullscreen + keep screen on
$('#fsBtn').onclick=async()=>{ try{ if(document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen(); }catch(e){ toast('이 화면에서는 전체화면이 안 돼요'); } wake(); };
let lock=null; async function wake(){ try{ if('wakeLock' in navigator && !lock){ lock=await navigator.wakeLock.request('screen'); lock.addEventListener('release',()=>lock=null);} }catch(e){} }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') wake(); });
document.addEventListener('pointerdown',wake,{once:true});

// tick: refresh clock; go home after 3 min idle
let lastAct=Date.now(), lastDay=dkey(new Date());
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,()=>lastAct=Date.now()));
setInterval(()=>{
  const d=new Date();
  if(dkey(d)!==lastDay){ lastDay=dkey(d); render(); }
  if(view!=='home' && !$('#modalRoot').innerHTML && Date.now()-lastAct>180000){ parentOk=false; go('home'); return; }
  if(view==='home'){ const c=$('#clk'); const s=`${pad(d.getHours())}:${pad(d.getMinutes())}`; if(c && c.textContent!==s) render(); }
},5000);

checkBadges(); render(); loadWeather(); setInterval(loadWeather, 30*60e3);
})();
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});}</script></body></html>
